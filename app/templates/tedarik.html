<!doctype html>
<html lang="en" data-layout="vertical" data-topbar="light" data-sidebar="dark" data-sidebar-size="lg"
    data-sidebar-image="none" data-preloader="disable">

<head>

    <meta charset="utf-8" />
    <title>Tedarik | FİMOTEK ERP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="Premium Multipurpose Admin & Dashboard Template" name="description" />
    <meta content="Themesbrand" name="author" />
    <!-- App favicon -->
    <link rel="shortcut icon" href="../static/images/favicon.ico">

    <!-- jsvectormap css -->
    <link href="../static/libs/jsvectormap/css/jsvectormap.min.css" rel="stylesheet" type="text/css" />

    <!--Swiper slider css-->
    <link href="../static/libs/swiper/swiper-bundle.min.css" rel="stylesheet" type="text/css" />

    <!-- Layout config Js -->
    <script src="../static/js/layout.js"></script>
    <!-- Bootstrap Css -->
    <link href="../static/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <!-- Icons Css -->
    <link href="../static/css/icons.min.css" rel="stylesheet" type="text/css" />
    <!-- App Css-->
    <link href="../static/css/app.min.css" rel="stylesheet" type="text/css" />
    <!-- custom Css-->
    <link href="../static/css/custom.min.css" rel="stylesheet" type="text/css" />


</head>

<body>

    <!-- Begin page -->
    <div id="layout-wrapper">

        {% include 'header.html' %}

        <!-- Vertical Overlay-->
        <div class="vertical-overlay"></div>

        <!-- ============================================================== -->
        <!-- Start right Content here -->
        <!-- ============================================================== -->
        <div class="main-content">

            <div class="page-content">
                <div class="container-fluid">


                    <div class="row">
                        <div class="col-xxl-12">
                            <div class="card">
                                <div class="card-header align-items-center d-flex">
                                    <h4 class="card-title mb-0 flex-grow-1">Talep Tahmini</h4>
                                </div><!-- end card header -->

                                <div class="card-body">
                                    <div class="live-preview">
                                        <form action="/tahmin" method="POST">
                                            <div class="row">
                                                <div class="col-md-6">
                                                    <div class="mb-3">
                                                        <label for="ForminputState" class="form-label">Firma Adı</label>
                                                        <select required name="firma" id="ForminputState"
                                                            class="form-select" data-choices
                                                            data-choices-sorting="true">
                                                            <option selected value="0">Firma Seçiniz..</option>
                                                            <option value="1">Thomas Mason</option>
                                                            <option value="2">Söktaş</option>
                                                            <option value="3">Fratelli Tallia di Delfino</option>
                                                            <option value="4">Vitale Barberis Canonico</option>
                                                            <option value="5">Dormeuil</option>
                                                        </select>
                                                    </div>
                                                </div>
                                                <div class="col-md-6">
                                                    <div class="mb-3">
                                                        <label for="ForminputState" class="form-label">Ürün Adı</label>
                                                        <select required name="urun" id="ForminputState"
                                                            class="form-select" data-choices
                                                            data-choices-sorting="true">
                                                            <option selected value="0">Ürün Seçiniz...</option>
                                                            <option value="1">Keten kumaş</option>
                                                            <option value="2">Pamuklu kumaş</option>
                                                            <option value="3">Yünlü kumaş</option>
                                                            <option value="4">İpek kumaş</option>
                                                            <option value="5">Kaşmir kumaş</option>
                                                        </select>
                                                    </div>
                                                </div>

                                                <div class="col-md-12">
                                                    <div class="mb-3">
                                                        <label for="ForminputState" class="form-label">Bölge</label>
                                                        <select required name="bolge" id="ForminputState"
                                                            class="form-select" data-choices
                                                            data-choices-sorting="true">
                                                            <option selected value="0">Bölge Seçiniz...</option>
                                                            <option value="1">Karadeniz</option>
                                                            <option value="2">Akdeniz</option>
                                                            <option value="3">Doğu Anadolu</option>
                                                            <option value="4">Ege</option>
                                                        </select>
                                                    </div>
                                                </div>

                                                <div class="col-md-6">
                                                    <div class="mb-3">
                                                        <label for="emailidInput" class="form-label">Stok
                                                            Seviyesi</label>
                                                        <input required name="stok_seviyesi" type="text"
                                                            class="form-control" placeholder="480" id="emailidInput">
                                                    </div>
                                                </div>

                                                <div class="col-md-6">
                                                    <div class="mb-3">
                                                        <label for="emailidInput" class="form-label">Satış
                                                            Fiyatı</label>
                                                        <input required name="satis_fiyati" type="text"
                                                            class="form-control" placeholder="33.5₺" id="emailidInput">
                                                    </div>
                                                </div>

                                                <div class="col-md-6">
                                                    <div class="mb-3">
                                                        <label for="emailidInput" class="form-label">Satılan
                                                            Birimler</label>
                                                        <input required name="satilan_birimler" type="text"
                                                            class="form-control" placeholder="Satılan Birimler"
                                                            id="emailidInput">
                                                    </div>
                                                </div>

                                                <div class="col-md-6">
                                                    <div class="mb-3">
                                                        <label for="emailidInput" class="form-label">Sipariş Edilen
                                                            Birimler</label>
                                                        <input required name="siparis_edilen_birimler" type="text"
                                                            class="form-control" placeholder="Sipariş Edilen Birimler"
                                                            id="emailidInput">
                                                    </div>
                                                </div>

                                                <div class="col-md-6">
                                                    <div class="mb-3">
                                                        <label for="address1ControlTextarea"
                                                            class="form-label">İndirim</label>
                                                        <input required name="indirim" type="number"
                                                            class="form-control" placeholder="5"
                                                            id="address1ControlTextarea" step="5">
                                                    </div>
                                                </div>

                                                <div class="col-md-6">
                                                    <div class="mb-3">
                                                        <label for="address1ControlTextarea" class="form-label">Rakip
                                                            Fiyatlandırması</label>
                                                        <input required name="rakip_fiyat" type="float"
                                                            class="form-control" placeholder="30"
                                                            id="address1ControlTextarea">
                                                    </div>
                                                </div>

                                                <div class="col-md-6">
                                                    <div class="mb-3">
                                                        <label for="ForminputState" class="form-label">Hava
                                                            Durumu</label>
                                                        <select required name="hava_durumu" id="ForminputState"
                                                            class="form-select" data-choices
                                                            data-choices-sorting="true">
                                                            <option selected value="0">Hava Durumu...</option>
                                                            <option value="1">Yağmurlu</option>
                                                            <option value="2">Güneşli</option>
                                                            <option value="3">Bulutlu</option>
                                                            <option value="4">Karlı</option>
                                                        </select>
                                                    </div>
                                                </div>

                                                <div class="col-md-6">
                                                    <div class="mb-3">
                                                        <label for="ForminputState" class="form-label">Sezon</label>
                                                        <select required name="sezon" id="ForminputState"
                                                            class="form-select" data-choices
                                                            data-choices-sorting="true">
                                                            <option selected value="0">Sezon Seçiniz...</option>
                                                            <option value="1">Yaz</option>
                                                            <option value="2">Sonbahar</option>
                                                            <option value="3">İlkbahar</option>
                                                            <option value="4">Kış</option>
                                                        </select>
                                                    </div>
                                                </div>

                                                <div class="col-lg-12">
                                                    <div class="text-end">
                                                        <button type="submit" class="btn btn-primary">Hesapla</button>
                                                    </div>
                                                </div>
                                            </div>
                                        </form>
                                    </div>
                                </div>

                            </div>
                        </div> <!-- end col -->

                        <!-- end col -->
                    </div>

                </div> <!-- container-fluid -->
            </div>
            <!-- End Page-content -->


            <footer class="footer">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-sm-6">
                            <script>document.write(new Date().getFullYear())</script> © Fimotek.
                        </div>
                        <div class="col-sm-6">
                            <div class="text-sm-end d-none d-sm-block">
                                Design & Develop by Fimotek
                            </div>
                        </div>
                    </div>
                </div>
            </footer>
        </div>
        <!-- end main content-->

    </div>
    <!-- END layout-wrapper -->





    <!--start back-to-top-->
    <button onclick="topFunction()" class="btn btn-danger btn-icon" id="back-to-top">
        <i class="ri-arrow-up-line"></i>
    </button>
    <!--end back-to-top-->

    <!--preloader-->
    <div id="preloader">
        <div id="status">
            <div class="spinner-border text-primary avatar-sm" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="static/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="static/libs/simplebar/simplebar.min.js"></script>
    <script src="static/libs/node-waves/waves.min.js"></script>
    <script src="static/libs/feather-icons/feather.min.js"></script>
    <script src="static/js/pages/plugins/lord-icon-2.1.0.js"></script>
    <script src="static/js/plugins.js"></script>

    <!-- prismjs plugin -->
    <script src="static/libs/prismjs/prism.js"></script>

    <script src="static/js/app.js"></script>

</body>

</html>

{% include 'sidebar.html' %}

<!-- End Page-content -->

<footer class="footer">
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-6">
                <script>document.write(new Date().getFullYear())</script> © Fimotek.
            </div>
            <div class="col-sm-6">
                <div class="text-sm-end d-none d-sm-block">
                    Design & Develop by Fimotek
                </div>
            </div>
        </div>
    </div>
</footer>
</div>
<!-- end main content-->

</div>
<!-- END layout-wrapper -->



<!--start back-to-top-->
<button onclick="topFunction()" class="btn btn-danger btn-icon" id="back-to-top">
    <i class="ri-arrow-up-line"></i>
</button>
<!--end back-to-top-->

<!--preloader-->
<div id="preloader">
    <div id="status">
        <div class="spinner-border text-primary avatar-sm" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
</div>

<!-- JAVASCRIPT -->
<script src="../static/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../static/libs/simplebar/simplebar.min.js"></script>
<script src="../static/libs/node-waves/waves.min.js"></script>
<script src="../static/libs/feather-icons/feather.min.js"></script>
<script src="../static/js/pages/plugins/lord-icon-2.1.0.js"></script>
<script src="../static/js/plugins.js"></script>

<!-- apexcharts -->
<script src="../static/libs/apexcharts/apexcharts.min.js"></script>

<!-- Vector map-->
<script src="../static/libs/jsvectormap/js/jsvectormap.min.js"></script>
<script src="../static/libs/jsvectormap/maps/world-merc.js"></script>

<!--Swiper slider js-->
<script src="../static/libs/swiper/swiper-bundle.min.js"></script>

<!-- Dashboard init -->
<script src="../static/js/pages/dashboard-ecommerce.init.js"></script>

<!-- App js -->
<script src="../static/js/app.js"></script>
</body>

</html>
